{% extends 'base.html' %}

{% block title %}Acceder — El Paraíso{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="1.5">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
        <h2 class="auth-title">Acceder</h2>
        <p class="auth-subtitle">Bienvenido a El Paraíso</p>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <div class="date-input-wrapper">
                    <input type="email" name="email" placeholder="tu@email.com" required>
                    <svg class="date-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </div>
            </div>
            <div class="form-group">
                <div class="form-group-header">
                    <label>Contraseña</label>
                    <a href="{{ url_for('recuperar_password') }}" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="date-input-wrapper">
                    <input type="password" name="password" placeholder="••••••••" required>
                    <svg class="date-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="auth-footer">
            ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Crear cuenta</a>
        </div>
    </div>
</section>

<style>
.form-group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}
.form-group-header label {
    margin-bottom: 0;
}
.forgot-link {
    font-size: 0.75rem;
    color: var(--accent);
    text-decoration: none;
    opacity: 0.7;
    transition: opacity 0.2s, text-shadow 0.2s;
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
}
.forgot-link:hover {
    opacity: 1;
    text-shadow: 0 0 10px var(--accent);
}
</style>
{% endblock %}
