{% extends 'base.html' %}

{% block title %}Crear Promoción — Admin El Paraíso{% endblock %}

{% block content %}
<section class="admin-section">
    <div class="container">
        <h1 class="admin-title">Crear Promoción</h1>

        <form method="POST" action="{{ url_for('crear_promocion') }}" style="max-width: 700px;">
            <div class="form-row">
                <div class="form-group">
                    <label>Código *</label>
                    <input type="text" name="codigo" placeholder="PARADISE20" required style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" name="nombre" placeholder="20% de descuento" required>
                </div>
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion" rows="3" placeholder="Describe la promoción..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Descuento %</label>
                    <input type="number" name="descuento_porcentaje" value="0" min="0" max="100">
                </div>
                <div class="form-group">
                    <label>Descuento valor fijo ($)</label>
                    <input type="number" name="descuento_valor" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>Tipo de entrada</label>
                    <select name="tipo_entrada">
                        <option value="">Todas</option>
                        <option value="general">General</option>
                        <option value="vip">VIP</option>
                        <option value="palco">Palco</option>
                        <option value="backstage">Backstage</option>
                        <option value="king">King</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Usos máximos</label>
                    <input type="number" name="usos_maximos" value="100" min="1">
                </div>
                <div class="form-group">
                    <label>Fecha inicio</label>
                    <input type="date" name="fecha_inicio" value="{{ now.strftime('%Y-%m-%d') if now else '' }}">
                </div>
                <div class="form-group">
                    <label>Fecha fin</label>
                    <input type="date" name="fecha_fin">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Crear promoción</button>
                <a href="{{ url_for('admin_promociones') }}" class="btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
