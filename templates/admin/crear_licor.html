{% extends 'base.html' %}

{% block title %}Crear Licor — Admin El Paraíso{% endblock %}

{% block content %}
<section class="admin-section">
    <div class="container">
        <h1 class="admin-title">Agregar Licor</h1>
        <form method="POST" action="{{ url_for('crear_licor') }}" enctype="multipart/form-data" style="max-width: 600px;">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="nombre" required>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion" rows="3"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Precio ($)</label>
                    <input type="number" name="precio" value="80000" min="0">
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select name="categoria">
                        <option value="aguardiente">Aguardiente</option>
                        <option value="ron">Ron</option>
                        <option value="whiskey">Whiskey</option>
                        <option value="vodka">Vodka</option>
                        <option value="tequila">Tequila</option>
                        <option value="champagne">Champagne</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Imagen</label>
                <input type="file" name="imagen" accept="image/*">
            </div>
            <div class="checkbox-group" style="margin-bottom: 24px;">
                <label>
                    <input type="checkbox" name="disponible" value="1" checked>
                    <span style="color: var(--text-secondary);">Disponible</span>
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary">Guardar</button>
                <a href="{{ url_for('admin_licores') }}" class="btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
