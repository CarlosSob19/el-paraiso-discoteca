{% extends 'base.html' %}

{% block title %}Editar Licor — Admin El Paraíso{% endblock %}

{% block content %}
<section class="admin-section">
    <div class="container">
        <h1 class="admin-title">Editar Licor</h1>
        <form method="POST" action="{{ url_for('editar_licor', id=licor.id) }}" enctype="multipart/form-data" style="max-width: 600px;">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="nombre" value="{{ licor.nombre }}" required>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion" rows="3">{{ licor.descripcion }}</textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Precio ($)</label>
                    <input type="number" name="precio" value="{{ "%.0f"|format(licor.precio) }}" min="0">
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select name="categoria">
                        <option value="aguardiente" {% if licor.categoria == 'aguardiente' %}selected{% endif %}>Aguardiente</option>
                        <option value="ron" {% if licor.categoria == 'ron' %}selected{% endif %}>Ron</option>
                        <option value="whiskey" {% if licor.categoria == 'whiskey' %}selected{% endif %}>Whiskey</option>
                        <option value="vodka" {% if licor.categoria == 'vodka' %}selected{% endif %}>Vodka</option>
                        <option value="tequila" {% if licor.categoria == 'tequila' %}selected{% endif %}>Tequila</option>
                        <option value="champagne" {% if licor.categoria == 'champagne' %}selected{% endif %}>Champagne</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Imagen actual</label>
                <img src="{{ licor.imagen }}" alt="" style="width: 120px; border-radius: 8px; margin-bottom: 12px; display: block;">
                <input type="file" name="imagen" accept="image/*">
            </div>
            <div class="checkbox-group" style="margin-bottom: 24px;">
                <label>
                    <input type="checkbox" name="disponible" value="1" {% if licor.disponible %}checked{% endif %}>
                    <span style="color: var(--text-secondary);">Disponible</span>
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary">Guardar cambios</button>
                <a href="{{ url_for('admin_licores') }}" class="btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
